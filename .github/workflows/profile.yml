name: Profile

on:
  schedule:
    - cron: "41 */6 * * *"  # every 6h, offset 41min to dodge peak
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/profile/**"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/profile/requirements.txt

      - name: Install dependencies
        run: pip install -r .github/profile/requirements.txt

      # ---- Hero, whoami, featured cards, toolbox, river (dark + light) ----
      - name: Build panels and featured projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/profile/build.py

      # ---- 3D contribution calendar ----
      - name: Build 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          MAX_REPOS: 300
          SETTING_JSON: .github/profile/contrib-3d.json

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets profile-3d-contrib
          if git diff --staged --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore(profile): refresh generated panels [skip ci]"
          git push
