name: Metrics

on:
  schedule:
    - cron: "23 */12 * * *"  # twice a day, offset to avoid peak
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ---- Overview metrics: header, activity, languages ----
      - name: Generate metrics.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: MiChongs
          filename: metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Shanghai
          config_padding: 0, 8 + 11%
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_limit_repositories: 200
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used

      # ---- Iso-calendar: contribution heatmap ----
      - name: Generate metrics-calendar.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: MiChongs
          filename: metrics-calendar.svg
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---- Languages: pie chart deep dive ----
      - name: Generate metrics-languages.svg
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: MiChongs
          filename: metrics-languages.svg
          template: classic
          base: ""
          config_timezone: Asia/Shanghai
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_limit_repositories: 200
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used, recently-used
          plugin_languages_colors: github
